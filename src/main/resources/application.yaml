spring:
  application:
    name: MC_1
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    url: ${MC1_DATABASE_URL}
    username: ${MC1_DATABASE_USER}
    password: ${MC1_DATABASE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect


server:
  port: ${MC1_PORT}

ws:
  uri: ${MC1_WS_URI}

app:
  timer:
    duration-seconds: ${MC1_DURATION_SECOND}


management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"